<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptbook Cast</title>
<!--
  Promptbook Cast: the script for the actors, in one file. No install, no server, no libraries.
  It shows the text, covers your own lines for practice, keeps your notes on this device
  and shows the notes sent by the stage manager or the director.
-->
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#1b1a17;--muted:#6f6a60;--line:#d9d3c6;--ui:#ece7dc;--acc:#0b5fbd;--mine:#c98a00;--bar:#1b1a17;--own:#fff3c4;--fs:17px}
body.night{--bg:#101114;--paper:#17181c;--ink:#e6e3dc;--muted:#9a958a;--line:#33353b;--ui:#22242a;--acc:#7fb2f0;--mine:#e0a52a;--bar:#4a4d55;--own:#3a3420}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.grow{flex:1}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:var(--ui);border-bottom:1px solid var(--line);font-size:15px}
#ttl{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button,#bar select{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
#bar select{max-width:42vw}
#bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#bar button b{display:inline-block;min-width:20px;margin-left:4px;padding:0 5px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;line-height:20px;text-align:center}
#text{position:relative;flex:1;overflow-y:auto;padding:16px 16px 40vh;scroll-behavior:smooth;--mw:36px}
#text>*{max-width:680px;margin-left:auto;margin-right:auto}
.b{position:relative;margin-top:12px;padding:2px calc(var(--mw) + 10px) 2px 8px;border-left:3px solid transparent;border-radius:4px}
.b.sel{background:var(--ui)}
.b.h1{margin-top:34px;font-size:1.35em;font-weight:700}
.b.h2{margin-top:24px;font-size:1.1em;font-weight:700}
.b.action,.b .it{font-style:italic}
.b.action{color:var(--muted)}
.b.para{color:var(--muted)}
.nm{font-size:.8em;font-weight:700;letter-spacing:.04em}
.nm small{font-weight:400;letter-spacing:0;color:var(--muted);margin-left:6px}
.b.mine{border-left-color:var(--mine)}
.b.mine .nm{color:var(--mine)}
.b.chg{border-left-style:dotted;border-left-color:var(--acc)}
.b.mine.chg{border-left-color:var(--mine)}
.side{position:absolute;top:0;right:0;width:var(--mw);font-size:var(--fs);font-weight:400;font-style:normal;color:var(--ink);cursor:pointer}
.side .note,.side .add{display:none}
.dot{display:block;width:30px;height:30px;margin-left:auto;padding:0;border-radius:50%;border:2px solid var(--c);background:var(--paper);font-size:13px;font-weight:700;line-height:1}
.dot.new{background:var(--c);color:#fff}
.dot.plus{border-style:dashed}
@media(min-width:860px){
#text{--mw:260px}
#text>*{max-width:950px}
.side .dot{display:none}
.side .note{display:flex;margin:0 0 4px;font-size:.78em}
.side .note .nt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.side .add{display:block;min-height:30px;padding:0 10px;border:1px dashed var(--line);border-radius:8px;background:var(--paper);font-size:.78em}
}
.hide .b.mine:not(.open) .ln{background:var(--bar);color:transparent;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer}
.hide .b.mine:not(.open) .ln *{color:transparent;border-color:transparent}
.hide .b.mine.open .ln{cursor:pointer}
.meta{text-align:center;padding:6vh 0 4vh}
.meta .big{font-size:1.7em;font-weight:700;margin-bottom:.4em}
.meta .chars{margin-top:1.6em;text-align:left;display:inline-block;font-size:.92em}
.meta .chars i{color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;margin:6px 0 2px;padding:6px 10px;border-radius:8px;font-size:.9em;line-height:1.35;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c,var(--acc))}
.note .nt{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.note .nh{display:block;font-size:.82em;font-weight:700;color:var(--muted)}
.note.read{opacity:.55}
.note.own{background:var(--own);border-color:transparent;border-left-color:var(--mine);white-space:pre-wrap;overflow-wrap:anywhere}
.note.own.moved{border-left-style:dotted}
.note button,.acts button,.btn{min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts{display:flex;gap:8px;margin:6px 0 2px}
.ed textarea{display:block;width:100%;min-height:76px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.box{width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;background:var(--paper);border-radius:14px 14px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.25)}
@media(min-width:700px){#sheet{align-items:center}.box{border-radius:14px}}
.box header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.box .body{overflow-y:auto;padding:12px 16px 18px}
.box h3{margin:16px 0 6px;font-size:.85em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hint{color:var(--muted);font-size:.88em;margin:0 0 10px}
.hint.warn{color:#b3261e}
.btn.wide{display:block;width:100%;min-height:40px;margin:0 0 6px;text-align:left}
.ed{margin-bottom:10px}
.pick{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0;border-bottom:1px solid var(--line)}
.pick input{width:22px;height:22px;flex:none}
.pick small{color:var(--muted);margin-left:auto}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chip{min-height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.chip.on{background:var(--ink);color:var(--paper)}
.item{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 10px;border:1px solid var(--line);border-left:5px solid var(--c,var(--acc));border-radius:8px;background:var(--paper)}
.item.read{opacity:.55}
.item small{display:block;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mrow .btn{flex:1;min-height:42px;text-align:left}
.mrow .btn.sq{flex:none;width:48px;text-align:center}
.card{max-width:440px;margin:10vh auto 0;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--paper);text-align:center}
.card h1{margin:0 0 4px;font-size:1.4em}
.card .btn{display:block;width:100%;min-height:46px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:.9em;z-index:9}
@media print{#bar,#sheet,#toast,.dot,.add{display:none!important}body{display:block}#text{overflow:visible;padding:0}}

</style>
</head>
<body>
<header id="bar">
  <b id="ttl"></b>
  <select id="outline"></select>
  <span class="grow"></span>
  <button id="bPart" type="button"></button>
  <button id="bHide" type="button"></button>
  <button id="bNotes" type="button"></button>
  <button id="bMore" type="button">&#8943;</button>
</header>
<main id="text"></main>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input id="filePick" type="file" hidden>
<script type="application/json" id="pack">/*PACK*/</script>

  const parts0 = S.meta ? [S.meta.lines.length && 'front', S.meta.chars.length && 'cast'].filter(Boolean) : [];

  let li = -1, sub = 0, tail = 0;   // the locked page being filled, pages inserted after it, pages past the last locked one
  const label = to => {
    const L = lk.pages;
    if (to != null) { li = to; sub = 0; }
    else if (li < 0) li = 0;
    else if (li >= L.length - 1) return String((parseInt(L[L.length - 1], 10) || L.length) + (++tail));
    else if (!sub && lk.cont[li + 1]) li++;   // the next page opened mid-block before: what runs over goes on it

    const m = g.m, b = g.kind === 'single' ? g.b : null;

      });

    P.sig = P.no + '|' + P.label + (P.chg ? '*' + S.cfg.lock.name : '') + '|' + P.head + '|' + titleOf() + '|' + parts.join(',');
    P.fsig = facingSig(P);
    P.rails = [];
  }
  for (const s of S.pairs) {   // a paired cue runs from its page to the page of its end
    const e = s.endRef; if (!s.page || !e.page) continue;

  S.pages = pages; S.pageOff = off;
  const now = new Set(pages.map(P => P.label));
  S.lockInfo = lk ? { changed: pages.filter(P => P.chg).map(P => P.label), gone: lk.pages.filter(x => !now.has(x)) } : null;
}

/* =====================================================================

/* the actor's layer is found by the id the prompt book gave the show; a file without one, by its title */

let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }

/* ---------- show ---------- */

      if (!got.length && !mine.length && !lost.length) body.appendChild(h('p', 'hint', t('acNoNotes')));
      if (got.length) body.appendChild(h('h3', null, t('acGot') + ' (' + got.length + ')'));
      for (const n of got) item(isRead(n) ? ' read' : '', n.colour, n.from + (n.to.length ? ' · ' + t('acTo', n.to.join(', ')) : '') + ' · ' + line(n.block), n.text, n.block);
      if (mine.length) body.appendChild(h('h3', null, t('acMine') + ' (' + mine.length + ')'));
      for (const n of mine) item('', 'var(--mine)', line(n.idx), n.text, n.idx);
      if (lost.length) { body.appendChild(h('h3', null, t('acLost') + ' (' + lost.length + ')')); body.appendChild(h('p', 'hint', t('acLostHint'))); }
      for (const n of lost) {
        const el = h('div', 'item'), row = h('div', 'acts'); el.style.setProperty('--c', 'var(--mine)');
        sheetBtn(row, t('del'), '', () => { rm(C.st.own, n); saveState(); fill(); });
        el.append(h('small', null, snip(n.key.split('\u0001')[1])), n.text, row); body.appendChild(el);
      }
    };
    fill();
  });
}
/* shown when a newer file of a show already on this device is opened: what the actor should look at */
function openNews() {
  openSheet(t('acNews'), body => {
    body.appendChild(h('p', 'hint', t('acNewsFile', day(C.pack.when))));
    const mineChg = [], n = unread(), moved = C.st.own.filter(q => q.moved && q.idx >= 0), lost = C.st.own.filter(q => q.idx < 0).length;
    const chg = new Set(C.st.changed); let all = 0;
    C.blocks.forEach((b, i) => { if (!b.plain || !chg.has(hash(blockKey(b)))) return; all++; if (isMine(b)) mineChg.push(i); });
    const jumpBtn = (label, i) => sheetBtn(body, label, 'wide', () => { closeSheet(); jump(i); });
    if (n) sheetBtn(body, t('acNewsNotes', n), 'wide pri', openNotes);
    if (all) body.appendChild(h('h3', null, t('acNewsLines', all, mineChg.length)));
    for (const i of mineChg.slice(0, 40)) jumpBtn(snip(C.blocks[i].plain), i);
    if (moved.length) body.appendChild(h('h3', null, t('acNewsMoved', moved.length)));
    for (const q of moved) jumpBtn(q.text, q.idx);
    if (lost) sheetBtn(body, t('acNewsLost', lost), 'wide', openNotes);
    if (!n && !all && !moved.length && !lost) body.appendChild(h('p', null, t('acNewsNone')));
  });
}
function openMore() {
  openSheet(C.pack ? C.pack.title || t('untitled') : 'Promptbook', body => {
    const row = () => { const r = h('div', 'mrow'); body.appendChild(r); return r; };
    if (C.noStore) body.appendChild(h('p', 'hint warn', t('acNoStore')));
    sheetBtn(row(), t('acOpen'), '', () => { closeSheet(); pickFile(); });
    const sz = row(); sz.appendChild(h('span', 'grow', t('acSize')));
    const size = d => { C.view.size = clamp(C.view.size + d, 13, 26); saveView(); updBar(); layoutSide(); };
    sheetBtn(sz, 'A−', 'sq', () => size(-1)); sheetBtn(sz, 'A+', 'sq', () => size(1));
    sheetBtn(row(), t('night'), '', () => { C.view.night = !C.view.night; saveView(); updBar(); });
    if (C.pack) { const r = row(); sheetBtn(r, t('acExport'), '', exportNotes); sheetBtn(r, t('acImport'), '', () => { closeSheet(); pickFile(); }); }
    if (C.pack) sheetBtn(row(), t('acNews'), '', openNews);
    sheetBtn(row(), t('acLang'), '', () => { closeSheet(); switchLang(); });
    if (C.pack) body.appendChild(h('p', 'hint', t('acSent', day(C.pack.when)) + ' · ' + t('acApp') + ' ' + VERSION));
  });
}
function switchLang() { LANG = LANG === 'it' ? 'en' : 'it'; saveView(); render(); }

/* ---------- files ---------- */
function download(name, blob) {
  const a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportNotes() {
  const o = { format: 'promptbook-cast-notes', version: 1, show: C.pack.show || '', title: C.pack.title, when: new Date().toISOString(), chars: C.st.chars, read: C.st.read, own: C.st.own };
  download((C.pack.title || 'show').replace(/[^\p{L}\p{N}]+/gu, '-').toLowerCase() + '.my-notes.json', new Blob([JSON.stringify(o)], { type: 'application/json' }));
  closeSheet();
}
/* A .cast.json file, a cast .html file with the show inside, or the notes exported from another device.
   A file older than the one this device already took over is opened only after a yes; sure skips the question. */
function readCastFile(text, sure) {
  let s = String(text).trim();
  if (s[0] !== '{') {
    const a = s.indexOf('id="pack">'), z = a < 0 ? -1 : s.indexOf('<' + '/script', a);
    if (z < 0) throw new Error(t('acBad'));
    s = s.slice(a + 10, z).trim();
  }
  let o; try { o = JSON.parse(s); } catch (e) { throw new Error(t('acBad')); }
  if (o && o.format === 'promptbook-cast-notes' && C.pack) {
    const have = new Set(C.st.own.map(n => n.id)), add = (Array.isArray(o.own) ? o.own : []).filter(n => n && typeof n.text === 'string' && typeof n.key === 'string' && !have.has(n.id));
    C.st.own.push(...add);
    for (const n of Array.isArray(o.chars) ? o.chars : []) if (C.names.has(n) && !C.st.chars.includes(n)) C.st.chars.push(n);
    for (const id of Array.isArray(o.read) ? o.read : []) if (!C.st.read.includes(String(id))) C.st.read.push(String(id));
    anchorOwn(true); saveState(); render(); toast(t('acImported', add.length));
    return;
  }
  const had = o && o.format === 'promptbook-cast' ? lsGet(keyOf(o)) : null;
  if (!sure && had && typeof had.when === 'string' && String(o.when || '') < had.when && !confirm(t('acOlderAsk', day(had.when)))) return;
  usePack(o); lsSet('pack', o); render(); $('#text').scrollTop = 0;
  if (C.news) openNews(); else toast(C.older ? t('acOlder', day(C.st.when)) : t('acLoaded', day(o.when)));
}
function pickFile() {
  const fp = $('#filePick'); fp.accept = '.json,.html,.htm,application/json,text/html'; fp.value = '';
  fp.onchange = async () => { const f = fp.files[0]; if (!f) return; try { readCastFile(await f.text()); } catch (e) { toast(e.message); } };
  fp.click();
}

/* ---------- start ---------- */
function bindCast() {
  $('#bPart').onclick = openPart;
  $('#bHide').onclick = () => setHide(!C.st.hide);
  $('#bNotes').onclick = openNotes;
  $('#bMore').onclick = openMore;
  $('#outline').onchange = e => { const v = e.target.value; e.target.value = ''; if (v !== '') jump(+v); };
  window.addEventListener('resize', layoutSide);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (C.sel >= 0) select(-1); } });
  $('#text').addEventListener('click', e => {
    const tg = e.target, el = tg.closest('.b');
    if (!el) { if (C.sel >= 0) select(-1); return; }
    const i = +el.dataset.i;
    if (tg.closest('.side')) { openLine(i); return; }
    /* practising: a tap on a covered line shows it, a tap on a shown one covers it again */
    if (C.st.hide && el.classList.contains('mine') && tg.closest('.ln')) { if (!C.open.delete(i)) C.open.add(i); el.classList.toggle('open', C.open.has(i)); return; }
    select(i === C.sel ? -1 : i);
  });
}
function initCast() {
  const pv = lsGet('view') || {};
  if (pv.size) C.view.size = clamp(+pv.size || 17, 13, 26);
  C.view.night = pv.night === true;
  C.noStore = !lsSet('probe', 1) || lsGet('probe') !== 1;
  let p = null; const raw = $('#pack').textContent.trim();
  if (raw[0] === '{') { try { p = JSON.parse(raw); } catch (e) { p = null; } }
  if (!p) p = lsGet('pack');
  LANG = pv.lang === 'it' || pv.lang === 'en' ? pv.lang : p && (p.lang === 'it' || p.lang === 'en') ? p.lang : /^it/i.test(navigator.language || '') ? 'it' : 'en';
  bindCast();
  if (p) { try { usePack(p); } catch (e) { C.pack = null; toast(e.message); } }
  render();
  if (C.pack && C.news) openNews(); else if (C.pack && C.older) toast(t('acOlder', day(C.st.when)));
}
window.PBC = { C, usePack, render, readCastFile, forMe, unread, openLine, openNews, layoutSide };
initCast();

</script>
