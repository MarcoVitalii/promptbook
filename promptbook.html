*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{
  --pw:793px;--ph:1122px;--text-w:399px;
  --paper:#fffdf7;--tx:#1b1a17;--tx2:#57534b;--muted:#8a857a;--rule:#d8d2c4;
  --desk:#dedad0;--ui:#f5f3ee;--ui2:#eae7df;--ui-b:#cfc9bb;--ui-ink:#24221e;--acc:#a3391f;--sel:#ffe7a0;
}
body.night{
  --paper:#17181a;--tx:#e6e2d8;--tx2:#b5b0a4;--muted:#807c72;--rule:#35373b;
  --desk:#0b0c0d;--ui:#1c1d20;--ui2:#26282c;--ui-b:#3a3c41;--ui-ink:#e2dfd6;--acc:#e58a68;--sel:#5d4c10;
}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ui-ink);background:var(--desk);
  display:flex;flex-direction:column;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- toolbar ---------- */
#bar{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--ui);border-bottom:1px solid var(--ui-b);flex-wrap:wrap;position:relative;z-index:5}
#bar button,.btn{background:var(--ui2);border:1px solid var(--ui-b);border-radius:6px;min-height:36px;min-width:34px;padding:0 8px;cursor:pointer;white-space:nowrap}
#bar button:disabled,.btn:disabled{opacity:.4;cursor:default}
#bar button.on,.btn.on{background:var(--ui-ink);color:var(--ui);border-color:var(--ui-ink)}
.btn.pri{background:var(--ui-ink);color:var(--ui);border-color:var(--ui-ink)}
.btn.sm{min-height:30px;font-size:13px}
.btn.danger{color:var(--acc)}
#bar .sw{width:28px;min-width:28px;height:28px;min-height:28px;border-radius:50%;padding:0;background:var(--c);border:3px solid var(--ui);box-shadow:0 0 0 1px var(--ui-b)}
#bar .sw.on{background:var(--c);box-shadow:0 0 0 3px var(--ui-ink)}
.sep{width:1px;height:26px;background:var(--ui-b);margin:0 1px}
.grow{flex:1}
#who{display:flex;flex-direction:column;justify-content:center;line-height:1.2;max-width:150px;min-width:0}
#showName{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#outline,#search{min-height:36px;border:1px solid var(--ui-b);border-radius:6px;background:var(--paper);color:var(--tx);padding:0 8px}
#outline{max-width:120px}#search{width:96px}
#status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.err{color:var(--acc);font-weight:700}
#bReview b{color:var(--acc)}
#menu{position:absolute;left:10px;top:46px;background:var(--ui);border:1px solid var(--ui-b);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;display:flex;flex-direction:column;min-width:230px;z-index:20}
#menu button{border:0;background:transparent;text-align:left;border-radius:6px;min-height:38px}
#menu button:hover{background:var(--ui2)}
#banner{background:var(--sel);color:var(--tx);padding:7px 12px;display:flex;gap:10px;align-items:center;font-size:13px;border-bottom:1px solid var(--ui-b)}
#banner span{margin-right:auto}

/* ---------- work area ---------- */
#work{flex:1;display:flex;min-height:0}
#desk{flex:1;overflow:auto;padding:14px;touch-action:none;position:relative;overscroll-behavior:contain}
#zoomwrap{margin:0 auto;position:relative}
#spreads{transform-origin:0 0;position:absolute;left:0;top:0}
.spread{display:flex;gap:20px;margin-bottom:24px}
body:not(.facing) .page.facing{display:none}

.page{position:relative;flex:none;width:var(--pw);height:var(--ph);background:var(--paper);color:var(--tx);overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.28);user-select:none;-webkit-user-select:none;
  font-family:"PB","Segoe UI",Arial,sans-serif;font-size:15px;line-height:22px;
  text-rendering:geometricPrecision;font-kerning:normal;font-variant-ligatures:none;font-synthesis:none}
.phead{position:absolute;left:38px;right:46px;top:20px;font-size:11px;line-height:14px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--rule);padding-bottom:5px;height:20px}
.pfoot{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:12px;line-height:14px;color:var(--muted)}
.pbody{position:absolute;left:0;top:54px;width:100%}

.row{display:grid;grid-template-columns:118px var(--text-w);column-gap:12px;padding:0 0 8px 38px;align-items:start}
.nm{font-weight:700;font-size:13px;letter-spacing:.02em;overflow-wrap:anywhere;min-height:22px}
.nm.cont{font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx{overflow-wrap:break-word;min-height:22px;min-width:0}
.row.action .tx{color:var(--tx2);font-style:italic}
.w.it,.x{font-style:italic;color:var(--tx2)}
.row.para .nm::before{content:"?";color:var(--acc);font-weight:700}
.row.h1{display:block;padding:18px 226px 10px 38px}
.row.h1 .tx{font-weight:700;font-size:20px;line-height:26px;letter-spacing:.03em;border-bottom:2px solid var(--tx);padding-bottom:4px}
.row.h2{display:block;padding:8px 226px 8px 38px}
.row.h2 .tx{font-weight:700;font-size:15px;line-height:22px;letter-spacing:.02em}
.row.mark{height:22px;padding-bottom:0;align-items:center}
.row.front{display:block;box-sizing:border-box;padding:0 46px 0 38px}
.row.front.none{height:0;padding:0}
.row.front .tx{height:100%;box-sizing:border-box;padding-bottom:16%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.row.front .tx.cast{display:block;text-align:left;padding:40px 30px 0}
.ch{font-weight:700;font-size:22px;line-height:30px;letter-spacing:.03em;border-bottom:2px solid var(--tx);padding-bottom:4px;margin-bottom:18px}
.ce{font-size:15px;line-height:22px;padding:0 0 6px 1.2em;text-indent:-1.2em;break-inside:avoid}
.cast.two .cl2{columns:2;column-gap:28px}
.cast.two .ce{font-size:13px;line-height:19px;padding-bottom:4px}
.ca{color:var(--muted)}
.cd{color:var(--tx2)}
.ft{font-weight:700;font-size:38px;line-height:46px;letter-spacing:.02em;margin:0 0 20px}
.fl{font-size:18px;line-height:30px;color:var(--tx2)}
.page.frontpg .phead,.page.frontpg .pfoot{display:none}
.row.mark .rule{border-top:1.5px dashed var(--muted);height:0;opacity:.6}
.row.simul .simnm{font-weight:400;font-size:11px;font-style:italic;color:var(--muted);letter-spacing:0}
.simcols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-left:3px double var(--muted)}
.simcell{min-width:0;padding:0 7px}
.simcell+.simcell{border-left:1px solid var(--rule)}
.simcell .nm{min-height:0}

.w{cursor:pointer;border-radius:2px}
/* a box round the cue word; drawn as a shadow so it never moves the text */
.w.cued{box-shadow:var(--ring,0 0 0 1.5px var(--c));background:color-mix(in srgb,var(--c) 13%,transparent);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.sel{background:var(--sel)}
@media (hover:hover){.w:hover{background:color-mix(in srgb,var(--tx) 9%,transparent)}}
.row.flash{animation:fl 1.5s}
@keyframes fl{0%,55%{background:var(--sel)}100%{background:transparent}}

.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;pointer-events:auto;width:166px;text-align:left;font:400 12px/15px "PB","Segoe UI",Arial,sans-serif;color:var(--tx);
  background:color-mix(in srgb,var(--c) 17%,var(--paper));border:0;border-left:4px solid var(--c);border-radius:0 4px 4px 0;padding:2px 6px 3px;cursor:pointer;overflow-wrap:anywhere}
.tag b{font-weight:700}
.tag.unk{border-left-style:dotted}
.tag.etag{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--c)}
.tag.etag b::before{content:"";display:inline-block;width:7px;height:7px;background:var(--c);margin-right:5px}
.tag.btag b::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid currentColor;margin-right:5px}
.links,.ink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.links path{fill:none;stroke-width:1.2}
.links path.rail{stroke-width:2.4;opacity:.8;stroke-linejoin:round}
.ink path,.bstrokes path,.bstatic path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.bbase{opacity:var(--tfade,.4);filter:grayscale(1)}
path.kblack{stroke:var(--tx)}
body.nocues .w.cued{box-shadow:none;background:none}
body.nocues .tags,body.nocues .links,body.nocues .row.mark .rule{visibility:hidden}
body.noink .ink,body.noink .bstrokes,body.noink .flag{visibility:hidden}
.flag{position:absolute;left:8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--acc);color:#fff;font:700 13px/22px sans-serif;padding:0;cursor:pointer}

/* facing page */
.fbody{position:absolute;left:30px;right:30px;top:54px;bottom:58px;display:flex;flex-direction:column;align-items:center;gap:12px}
.board{margin:0;display:flex;flex-direction:column}
.bcap{display:flex;align-items:center;gap:6px;height:26px;font-size:12px;line-height:16px;color:var(--tx2)}
.bcap b{font-weight:700;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcap button,.addboard{font:inherit;font-size:11px;min-height:22px;padding:0 7px;border:1px solid var(--rule);background:transparent;color:var(--tx2);border-radius:4px;cursor:pointer}
.board svg{display:block;background:var(--paper);outline:1px solid var(--rule)}
.bcap{flex-wrap:nowrap;overflow:hidden}
#tpl{display:none;max-width:1020px;margin:0 auto}
body.tplmode #tpl{display:block}
.tplbar{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:6px 0;position:sticky;top:-14px;background:var(--desk);z-index:3}
.tplbar h2{font-size:18px;margin:0 auto 0 0}
.tplhint{font-size:13px;color:var(--muted);margin:0 0 14px;max-width:70ch}
.page.tsheet{width:max-content;height:auto;overflow:visible;padding:12px 16px 16px;margin:0 auto 16px}
.tsheet .bcap{height:auto;min-height:26px;flex-wrap:wrap;overflow:visible;row-gap:4px;margin-bottom:6px}
@media screen{body.tplmode #zoomwrap{display:none}}
.board svg image{pointer-events:none}
.addboard{min-height:38px;padding:0 16px;font-size:13px;border-style:dashed}
.fempty{margin-top:120px;color:var(--muted);font-size:13px;text-align:center}

/* ---------- drawer ---------- */
#drawer{width:440px;max-width:92vw;background:var(--ui);border-left:1px solid var(--ui-b);display:flex;flex-direction:column;min-height:0}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ui-b)}
.dhead h2{font-size:15px;margin:0 auto 0 0}
.dbody{overflow:auto;flex:1;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--ui-b);background:var(--ui2);border-radius:999px;min-height:30px;padding:0 12px;cursor:pointer;border-left:5px solid var(--c,var(--ui-b))}
.chip.on{background:var(--ui-ink);color:var(--ui)}
table.cl{width:100%;border-collapse:collapse;font-size:13px}
.cl td,.cl th{padding:6px;border-bottom:1px solid var(--ui-b);vertical-align:top;text-align:left}
.cl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.cl tr.cr{cursor:pointer}
.cl tr.cr:hover{background:var(--ui2)}
.cl .dp{font-weight:700;white-space:nowrap;border-left:5px solid var(--c);padding-left:8px}
.cl .ctx{color:var(--muted);font-size:12px}
.cl .dupe{color:var(--acc);font-weight:700}
.cl .endl{color:var(--muted);font-size:12px;margin-top:3px}
.rv h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
.rv h3:first-child{margin-top:0}
.rv .it{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 4px;border-bottom:1px solid var(--ui-b);cursor:pointer}
.rv .it:hover{background:var(--ui2)}
.rv .hint{font-size:12px;color:var(--muted);margin:0 0 6px}
.rv .chars{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.rv .chars span b{font-weight:400;color:var(--muted)}
.rv .one{color:var(--acc)}

/* ---------- popover, editor, dialogs ---------- */
#pop{position:fixed;z-index:30;background:var(--ui);color:var(--ui-ink);border:1px solid var(--ui-b);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.3);padding:10px;width:310px;max-width:calc(100vw - 16px)}
.pt{font-size:12px;color:var(--muted);margin:0 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.depts{display:flex;flex-wrap:wrap;gap:6px}
.dbtn{flex:1 1 84px;min-height:48px;border:0;border-radius:8px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--ui));color:var(--ui-ink);font-weight:700;font-size:15px;line-height:1.15;cursor:pointer;text-align:left;padding:4px 10px}
.dbtn small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.dbtn.on{outline:2px solid var(--c);outline-offset:1px}
.depts.small .dbtn{min-height:36px;font-size:13px;flex-basis:60px}
.ends{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ends .elab{font-size:12px;color:var(--muted)}
.dbtn.ebtn{flex:0 1 auto;min-height:36px;font-size:13px;background:transparent;border-left-width:0;box-shadow:inset 0 0 0 1.5px var(--c);padding:4px 10px}
.dbtn.ebtn::before{content:"";display:inline-block;width:8px;height:8px;background:var(--c);margin-right:6px}
.pcol{display:flex;flex-direction:column;gap:6px}
.pcol .btn{text-align:left;min-height:40px}
.prow{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.prow .grow{flex:1}
.chk{font-size:13px;display:flex;align-items:center;gap:5px;margin-right:auto;min-height:30px}
.pin{width:100%;min-height:38px;border:1px solid var(--ui-b);border-radius:6px;background:var(--paper);color:var(--tx);padding:0 8px;margin-top:8px}
#editor{position:fixed;z-index:25;background:var(--ui);border:1px solid var(--ui-b);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.3);padding:8px;display:flex;flex-direction:column;gap:6px}
#editor textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--ui-b);border-radius:6px;background:var(--paper);color:var(--tx);padding:8px;font:15px/22px "PB","Segoe UI",Arial,sans-serif}
#editor .hint,.dbox .hint{font-size:12px;color:var(--muted)}
#editor .prow{margin-top:0}
#dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{background:var(--ui);color:var(--ui-ink);border-radius:12px;max-width:780px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.dbox.narrow{max-width:460px}
.dbox>header{padding:14px 18px 4px;font-weight:700;font-size:16px}
.dbox>.body{padding:8px 18px;overflow:auto}
.dbox>footer{padding:10px 18px 14px;display:flex;gap:8px;justify-content:flex-end}
textarea.big{width:100%;height:58vh;border:1px solid var(--ui-b);border-radius:6px;background:var(--paper);color:var(--tx);padding:10px;font:14px/1.5 ui-monospace,Consolas,"Courier New",monospace}
.form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.form input[type=text],.form select{min-height:36px;border:1px solid var(--ui-b);border-radius:6px;background:var(--paper);color:var(--tx);padding:0 8px;width:100%}
.drow{display:grid;grid-template-columns:76px 1fr 46px auto 36px;gap:6px;margin-bottom:6px;align-items:center}
.drow .chk{margin:0;font-size:12px;color:var(--ui-ink)}
.drow input[type=color]{width:46px;height:36px;padding:2px;border:1px solid var(--ui-b);border-radius:6px;background:var(--paper)}
pre.fmt{background:var(--ui2);border-radius:6px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;margin:6px 0 10px;white-space:pre-wrap}

#start{position:fixed;inset:0;z-index:35;background:var(--desk);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{background:var(--ui);border:1px solid var(--ui-b);border-radius:14px;padding:26px 28px;max-width:520px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.card h1{margin:0;font-size:24px;letter-spacing:.01em}
.card .sub{color:var(--muted);margin:2px 0 18px}
.card .btn{display:block;width:100%;min-height:46px;margin-top:8px;text-align:left;font-size:15px}
.card p{font-size:13px;color:var(--muted);margin:12px 0 0}
.card .warn{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ui-ink);color:var(--ui);padding:9px 16px;border-radius:999px;z-index:50;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw}
#measure{position:absolute;visibility:hidden;left:-20000px;top:0;width:var(--pw);font-family:"PB","Segoe UI",Arial,sans-serif;font-size:15px;line-height:22px;
  text-rendering:geometricPrecision;font-kerning:normal;font-variant-ligatures:none;font-synthesis:none}
#cuePrint{display:none}

/* ---------- print ---------- */
@media print{
  :root,body.night{--paper:#fff;--tx:#000;--tx2:#333;--muted:#666;--rule:#bbb;--sel:transparent}
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  #bar,#banner,#drawer,#pop,#editor,#dlg,#start,#toast,#menu,#tpl,.noprint,.flag{display:none!important}
  #work{display:block}
  #desk{overflow:visible;padding:0;height:auto}
  #zoomwrap{width:auto!important;height:auto!important;margin:0}
  #spreads{transform:none!important;position:static;width:auto!important}
  .spread{display:block;margin:0}
  .page{box-shadow:none;break-after:page;break-inside:avoid}
  body.pr-book .page.facing{display:block!important}
  body.pr-script .page.facing{display:none!important}
  .spread:last-child .page:last-child,body.pr-script .spread:last-child .page.script{break-after:auto}
  .w.sel{background:none}
  .row.para .nm::before{content:""}
  body.pr-cues #work{display:none}
  body.pr-cues #cuePrint{display:block;padding:12mm;color:#000;font:12px/1.4 "PB",Arial,sans-serif}
  #cuePrint h1{font-size:18px;margin:0 0 10px}
  #cuePrint table{width:100%;border-collapse:collapse}
  #cuePrint td,#cuePrint th{border-bottom:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  #cuePrint tr{break-inside:avoid}
  #cuePrint .dp{font-weight:700;border-left:5px solid var(--c);padding-left:8px;white-space:nowrap}
}

async function showStart() {
  const el = $('#start'); el.textContent = ''; el.hidden = false;
  const card = h('div', 'card');
  card.append(h('h1', null, 'Promptbook'), h('div', 'sub', t('appSub') + ' · ' + VERSION));
  const fs = !!window.showOpenFilePicker, fd = !!window.showDirectoryPicker;
  const add = (label, fn, pri) => { const b = h('button', 'btn' + (pri ? ' pri' : ''), label); b.type = 'button'; b.onclick = fn; card.appendChild(b); return b; };
  el.appendChild(card);
  const last = fs ? await idbGet('dir') : null;
  if (last && last.name) add(t('reopen', showName(last)), () => openAny(last), true);
  add(t('openFile'), () => openZipFile(), !(last && last.name)).disabled = !fs;
  add(t('openFolder'), () => openFolder()).disabled = !fd;
  const dr = loadDraft();
  if (dr) add(t('contDraft', new Date(dr.when).toLocaleString()), () => loadBundle(dr));
  add(t('trySample'), () => startMemory(SAMPLE, { title: 'Il molo' }));
  add(t('pasteNew'), () => { startMemory('', {}); openTextDialog(true); });
  add(t('importBk'), importBundle);
  card.appendChild(h('p', fs ? '' : 'warn', fs ? t('startHint') : t('noFs')));
  const lg = h('p'); const lb = h('button', 'btn sm', LANG === 'it' ? 'English' : 'Italiano'); lb.type = 'button';
  lb.style.cssText = 'display:inline-block;width:auto;min-height:30px';
  lb.onclick = () => { LANG = LANG === 'it' ? 'en' : 'it'; savePrefs(); applyLang(); showStart(); };
  lg.appendChild(lb); card.appendChild(lg);
}
async function init() {
  let pv = {};
  try { pv = JSON.parse(localStorage.getItem('promptbook:view') || '{}') || {}; } catch (e) { /* ignore */ }
  for (const k of ['facing', 'cues', 'ink', 'night']) if (typeof pv[k] === 'boolean') S.view[k] = pv[k];
  S.tool.finger = pv.finger === true;
  LANG = pv.lang === 'it' || pv.lang === 'en' ? pv.lang : (/^it/i.test(navigator.language || '') ? 'it' : 'en');
  S.cfg = defaultConfig();
  bindUI(); applyLang(); applyPaper(); applyView(); updUndo();
  try { await Promise.all(['400 15px PB', 'italic 400 15px PB', '700 15px PB', '700 13px PB', '700 20px PB'].map(f => document.fonts.load(f))); } catch (e) { /* falls back to system font */ }
  showStart();
}
window.PB = { S, VERSION, parseScript, analyze, stripTokens, serialize, commitText, openFolder, openZipFile, saveToZip, readZip, buildZip, startMemory, loadBundle, saveNow, bundle, inkFile, collectCues, reviewData, parseMeta, castCheck, fullName, relayout, renderAll, jumpTo, enterTemplates, exitTemplates, t };
init();
