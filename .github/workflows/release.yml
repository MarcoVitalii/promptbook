name: Release

# A pushed tag rX.Y: check, then publish promptbook.html and promptbook-cast.html as a GitHub release
# and put them, with the documents, on GitHub Pages.
# Run by hand from main ("Run workflow"): the site only, no release. Useful to try the pipeline.
on:
  push:
    tags: ['r[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ready:
    name: Tag matches VERSION and CHANGELOG
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/release-notes.sh "$TAG" > /dev/null

  check:
    needs: ready
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promptbook
      - name: Publish the two files with the CHANGELOG entry as notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" promptbook.html promptbook-cast.html \
            --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  pages:
    name: GitHub Pages
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
