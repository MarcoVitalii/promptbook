name: CI

# Builds promptbook.html from src/ and runs every check, on each pull request and each push to main.
# The release workflow calls it too, and takes the built files from its artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the pinned Playwright
        run: npm ci

      - name: Install Chromium, its system libraries and pdfinfo
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build and run every check
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/check.log"

      # The log of a run needs a GitHub login; the summary and the annotation of a run do not.
      - name: Say what failed
        if: failure()
        shell: bash
        run: |
          [ -s "$RUNNER_TEMP/check.log" ] || exit 0
          { echo '### Checks failed'; echo '```'; tail -n 40 "$RUNNER_TEMP/check.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Checks failed::$(tail -n 30 "$RUNNER_TEMP/check.log" | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"

      # A file that failed beside the others and passed alone leaves the run green (test/run.js): a warning, so that a flaky check is seen.
      - name: Say what passed only on its second run
        if: success() || failure()
        shell: bash
        run: |
          [ -s "$RUNNER_TEMP/check.log" ] || exit 0
          retried=$(awk '/ passed only on its second run; its first run said:$/ { on = 1; print; next } on && /^  / { print; next } { on = 0 }' "$RUNNER_TEMP/check.log")
          [ -n "$retried" ] || exit 0
          { echo '### Checks passed only on their second run'; echo '```'; echo "$retried"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Checks passed only on their second run::$(echo "$retried" | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"

      - name: Build the site
        run: npm run site

      - name: Keep the built tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptbook
          path: |
            promptbook.html
            promptbook-cast.html
          if-no-files-found: error
          retention-days: 30

      - name: Keep the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 7

      - name: Keep screenshots and PDFs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output
          path: .cache/out
          include-hidden-files: true
          retention-days: 7
