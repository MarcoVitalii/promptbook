<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptbook</title>
<!--
  Promptbook — a prompt book in one file. No install, no server, no libraries.
  Open it in Chrome or Edge.

  Embedded font: Inter (subset). Copyright 2016 The Inter Project Authors.
  Licensed under the SIL Open Font License 1.1 — https://scripts.sil.org/OFL
  The full text of the licence follows, at the top of the style sheet below.
-->
<style>
/*FONTS*/
/*CSS*/
</style>
<style id="pageRule"></style>
</head>
<body class="facing">
<header id="bar">
  <button id="bMenu" data-tt="menu">&#9776;</button>
  <span id="who"><b id="showName"></b><span id="status"></span></span>
  <span class="grp ed">
    <span id="pens"></span>
    <button id="bErase" data-t="eraser" data-k="E"></button>
    <button id="bFinger" data-t="finger" data-tt="fingerTip" data-k="F"></button>
  </span>
  <span class="grp ed">
    <button id="bUndo" data-tt="undo" data-k="Ctrl+Z">&#8630;</button>
    <button id="bRedo" data-tt="redo" data-k="Ctrl+Y">&#8631;</button>
  </span>
  <span class="grow"></span>
  <select id="outline" data-tt="jump"></select>
  <input id="search" type="search" data-tp="find" data-tt="kFind" data-k="Ctrl+F" autocomplete="off">
  <span class="grp">
    <button id="bFacing" data-t="boards" data-tt="boardsTip" data-k="B"></button>
    <button id="bCues" data-t="cues" data-tt="cuesTip" data-k="C"></button>
    <button id="bInk" data-t="ink" data-tt="inkTip" data-k="I"></button>
  </span>
  <span class="grp">
    <button id="bReview" data-k="R" hidden></button>
    <button id="bList" data-t="cueList" data-k="L"></button>
    <button id="bPrint" data-t="print" data-k="Ctrl+P"></button>
    <button id="bShow" data-t="showMode" data-tt="showTip" data-k="S"></button>
  </span>
  <div id="menu" hidden></div>
</header>
<div id="banner" hidden></div>
<div id="work">
  <div id="deskwrap">
    <main id="desk"><div id="zoomwrap"><div id="spreads"></div></div><div id="tpl"></div></main>
    <div id="dock">
      <button id="bNight" data-tt="night" data-k="N">&#9790;</button>
      <span class="sep"></span>
      <button id="zOut" data-tt="zoomOut" data-k="&minus;">&minus;</button>
      <button id="zFit" data-t="fit" data-tt="kFit" data-k="0"></button>
      <button id="zIn" data-tt="zoomIn" data-k="+">+</button>
      <span class="sep"></span>
      <button id="bKeys" data-tt="keys" data-k="?">?</button>
    </div>
  </div>
  <aside id="showside" hidden>
    <div id="shClock"></div>
    <div id="shCalls"></div>
    <div id="shLearnBox" hidden>
      <div><span id="shBlk"></span><button id="shDn" data-tt="shBlockTip">&minus;5 s</button><button id="shUp" data-tt="shBlockTip">+5 s</button></div>
      <div><span id="shLast"></span><button id="shUndo" data-t="undo" hidden></button></div>
      <div><span id="shShare"></span><button id="shRest" data-tt="shRestTip" hidden></button></div>
    </div>
    <div id="shCtl">
      <button id="shPlay" data-tt="shPlay" data-k="Space"></button>
      <span class="pace"><button id="shSlow" data-tt="shSlower" data-k="[">&minus;</button><span id="shWpm"></span><button id="shFast" data-tt="shFaster" data-k="]">+</button></span>
      <button id="shUse" data-tt="shUseTip" hidden></button>
      <button id="shBack" data-t="shBack" data-k="Enter" hidden></button>
    </div>
    <div id="shMore">
      <button id="shLearn" data-t="shLearn" data-tt="shLearnTip"></button>
      <button id="shNight" data-tt="night" data-k="N">&#9790;</button>
      <button id="shLeave" data-tt="kShLeave" data-k="S"></button>
    </div>
  </aside>
  <div id="shProg" data-tt="shMapTip" hidden></div>
  <aside id="drawer" hidden></aside>
</div>
<div id="pop" hidden></div>
<div id="editor" hidden></div>
<div id="dlg" hidden></div>
<div id="start" hidden></div>
<div id="toast" hidden></div>
<div id="measure"></div>
<div id="cuePrint"></div>
<input id="filePick" type="file" hidden>
<script>
/*JS*/
</script>
</body>
</html>
